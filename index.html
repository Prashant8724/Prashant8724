<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Prashant Patel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: linear-gradient(135deg,#e0e7ff,#f0f4ff);
      --fg:#111827;
      --card-bg: rgba(255,255,255,0.8);
      --primary:#3b82f6;
      --accent:#2563eb;
      --btn-text:#fff;
      --font:'Inter',sans-serif;
    }
    [data-theme="dark"]{
      --bg: linear-gradient(135deg,#0f172a,#1e293b);
      --fg:#f9fafb;
      --card-bg: rgba(30,41,59,0.8);
      --primary:#60a5fa;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:var(--font);color:var(--fg);background:var(--bg);
      min-height:100vh;padding:0;
      transition:background .3s ease,color .3s ease;
    }
    #loginOverlay{
      position:fixed;inset:0;background:rgba(0,0,0,.65);
      display:flex;align-items:center;justify-content:center;z-index:3000;
    }
    #loginBox{
      background:#fff;padding:20px;border-radius:12px;text-align:center;max-width:340px;width:90%;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
    }
    #loginBox h2{margin-bottom:12px;font-size:18px}
    #loginBox input{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;margin-bottom:10px}
    #loginBox button{width:100%;padding:10px;border-radius:8px;border:none;background:var(--primary);color:var(--btn-text);cursor:pointer}
    #errorMsg{color:#c62828;margin-top:8px;min-height:18px}
    .shake{animation:shake .36s}
    @keyframes shake{0%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}100%{transform:translateX(0)}}

    .topbar{position:fixed;top:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:2000}
    .toggle{width:44px;height:44px;border-radius:50%;background:var(--card-bg);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.12);font-size:20px}
    .profile{width:48px;height:48px;border-radius:50%;overflow:hidden;border:2px solid var(--primary)}
    .profile img{width:100%;height:100%;object-fit:cover}
    .logout{padding:8px 14px;border-radius:8px;background:#ef4444;color:#fff;border:none;cursor:pointer;font-weight:600}

    .container{max-width:920px;margin:110px auto 40px;padding:0 16px}
    h1{text-align:center;font-size:26px;margin-bottom:6px}
    p.location{text-align:center;color:rgba(0,0,0,.6);margin-bottom:16px}

    .tabs{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
    .tab{padding:8px 14px;border-radius:999px;background:var(--card-bg);cursor:pointer;border:1px solid rgba(0,0,0,.06);font-weight:600}
    .tab.active{background:var(--primary);color:#fff;box-shadow:0 8px 30px rgba(59,130,246,0.15)}

    .section{display:none;background:var(--card-bg);border-radius:12px;padding:18px;box-shadow:0 12px 36px rgba(0,0,0,0.08);margin-bottom:16px}
    .section.active{display:block}

    ul{list-style:none;padding:0;margin:8px 0 0}
    li.item{
      display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:8px;
      background:rgba(255,255,255,0.06);margin-bottom:8px;border:1px solid rgba(0,0,0,0.04)
    }
    [data-theme="dark"] li.item{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03)}
    li.item.done span{text-decoration:line-through;opacity:.6}

    .actions button{margin-left:6px;border:none;background:none;cursor:pointer;padding:6px;border-radius:8px}
    .actions button:hover{background:rgba(0,0,0,0.04)}
    .add-btn{float:right;padding:8px 12px;border-radius:8px;border:none;background:var(--primary);color:var(--btn-text);cursor:pointer}

    footer{text-align:center;color:rgba(0,0,0,.6);margin-top:8px;font-size:13px}
  </style>
</head>
<body>
  <div id="loginOverlay">
    <div id="loginBox">
      <h2>Enter Password</h2>
      <input id="passwordInput" type="password" placeholder="Password" />
      <div id="errorMsg"></div>
      <button id="unlockBtn">Unlock</button>
    </div>
  </div>

  <div id="dashboard" style="display:none;">
    <div class="topbar">
      <div class="toggle" id="themeToggle" title="Toggle theme">☀️</div>
      <button class="logout" id="logoutBtn">Logout</button>
      <div class="profile" title="Profile"><img src="https://i.pravatar.cc/100?img=3" alt="profile"></div>
    </div>

    <div class="container">
      <h1>Prashant Patel</h1>
      <p class="location">Bulandshahr, Uttar Pradesh</p>

      <div class="tabs">
        <div class="tab active" data-tab="focus">Focus</div>
        <div class="tab" data-tab="exams">Exams</div>
        <div class="tab" data-tab="goals">Goals</div>
        <div class="tab" data-tab="files">Files</div>
      </div>

      <div id="focus" class="section active">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <h2>Today's Focus</h2>
          <button class="add-btn" onclick="addItem('focusList')">+ Add</button>
        </div>
        <ul id="focusList"></ul>
      </div>

      <div id="exams" class="section">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <h2>Upcoming Exams</h2>
          <button class="add-btn" onclick="addItem('examsList')">+ Add</button>
        </div>
        <ul id="examsList"></ul>
      </div>

      <div id="goals" class="section">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <h2>Goals</h2>
          <button class="add-btn" onclick="addItem('goalsList')">+ Add</button>
        </div>
        <ul id="goalsList"></ul>
      </div>

      <div id="files" class="section">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <h2>My Files</h2>
          <button class="add-btn" onclick="addItem('filesList')">+ Add</button>
        </div>
        <ul id="filesList"></ul>
      </div>

      <footer>© 2025 Prashant Patel</footer>
    </div>
  </div>

<script>
  const data = {
    focus: ["Physics: Revise Electrostatics","Maths: Practice Integration Problems"],
    exams: ["Maths","NDA EXAM on 14","English","Chemistry","IP","Physics"],
    goals: ["Score 90%+ in Board Exams"],
    files: ["[Your files here]"]
  };

  function renderAll(){
    for(const key of Object.keys(data)){
      const ul = document.getElementById(key + "List");
      ul.innerHTML = "";
      data[key].forEach((txt, i) => {
        const li = document.createElement("li");
        li.className = "item";
        const span = document.createElement("span");
        span.textContent = txt;
        const actions = document.createElement("div");
        actions.className = "actions";
        const tick = document.createElement("button"); tick.innerHTML = "✔"; tick.onclick = ()=> { li.classList.add("done"); };
        const cross = document.createElement("button"); cross.innerHTML = "✖"; cross.onclick = ()=> { li.classList.remove("done"); };
        const edit = document.createElement("button"); edit.innerHTML = "✏"; edit.onclick = ()=> {
          const nt = prompt("Edit item:", data[key][i]);
          if(nt!==null && nt.trim()!==""){ data[key][i] = nt.trim(); renderAll(); }
        };
        const del = document.createElement("button"); del.innerHTML = "🗑"; del.onclick = ()=> {
          if(confirm("Delete item?")) { data[key].splice(i,1); renderAll(); }
        };
        actions.appendChild(tick); actions.appendChild(cross); actions.appendChild(edit); actions.appendChild(del);
        li.appendChild(span); li.appendChild(actions);
        ul.appendChild(li);
      });
    }
  }

  function addItem(listId){
    const key = listId.endsWith("List") ? listId.slice(0,-4) : listId;
    const t = prompt("Enter new item:");
    if(!t) return;
    data[key].push(t);
    renderAll();
  }

  document.querySelectorAll(".tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
      tab.classList.add("active");
      const target = tab.dataset.tab;
      document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
      document.getElementById(target).classList.add("active");
    });
  });

  const themeToggle = document.getElementById("themeToggle");
  let dark = false;
  themeToggle.addEventListener("click", ()=>{
    dark = !dark;
    if(dark){
      document.documentElement.setAttribute("data-theme","dark");
      themeToggle.textContent = "🌙";
    } else {
      document.documentElement.removeAttribute("data-theme");
      themeToggle.textContent = "0";
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", ()=>{
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("loginOverlay").style.display = "flex";
    document.getElementById("passwordInput").value = "";
  });

  const unlockBtn = document.getElementById("unlockBtn");
  const pwdInput = document.getElementById("passwordInput");
  const errorMsg = document.getElementById("errorMsg");
  unlockBtn.addEventListener("click", checkPassword);
  pwdInput.addEventListener("keyup", e => { if(e.key === "Enter") checkPassword(); });

  function checkPassword(){
    const v = pwdInput.value;
    if(v === "India@123"){
      document.getElementById("loginOverlay").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      renderAll();
    } else {
      errorMsg.textContent = "Incorrect Password!";
      const box = document.getElementById("loginBox");
      box.classList.add("shake");
      setTimeout(()=>box.classList.remove("shake"), 360);
    }
  }
</script>
</body>
</html>
